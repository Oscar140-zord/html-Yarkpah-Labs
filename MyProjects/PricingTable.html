<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body{
         background: linear-gradient(to bottom, rgb(192, 192, 252), rgb(138, 43, 226));
      }
    .plan-features {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .plan-features li {
      margin-bottom: 20px;
    }

      body {
        font-family: "Sono", sans-serif;
       

      }
  .pricing-container {
      display: flex;
      flex-direction:row;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 2rem;
    }
    .pricing-plan{
      flex:1;
      background-color:rgb(247, 241, 241);
      max-width: 350px;
      text-align: center;
      padding:20px;
      border-radius: 5px;
    }
    .plan-title {
      font-size: 20px;
      font-weight:bold;
      margin-bottom: 10px;
    }
    .plan-price{
      font-size :30px;
      font-weight:bold;
      margin-bottom:10px;
    }
    button{
      background-color:rgb(247, 81, 5);
      border:none;
      padding: 10px;
      border-radius: 5px;
      color:white;
      
    }
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 780px) {
        .pricing-container{
          flex-direction: column;
          width: 100%;
          height:100%
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$10.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
